<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CMS Admin</title>
</head>
<body>
    <script>
        window.CMS_MANUAL_INIT = true;
        window.CMS_DEBUG = true;
    </script>
    <script src="https://cdn.jsdelivr.net/npm/decap-cms@3.3.0/dist/decap-cms.js?v=1"></script>
    <script>
        console.log('CMS inline init v1');
        CMS.init({
            config: {
                load_config_file: false,
                backend: {
                    name: "github",
                    repo: "garlik-w/wllw.studio",
                    branch: "main",
                    auth_type: "implicit",
                    app_id: "Ov23lib8MLAF8TntHnFC"
                },
                media_folder: "uploads",
                public_folder: "/uploads",
                collections: [
                    {
                        name: "site",
                        label: "Site",
                        files: [
                            {
                                file: "content/home.json",
                                label: "Home",
                                name: "home",
                                format: "json",
                                fields: [
                                    { label: "Title", name: "title", widget: "string" },
                                    { label: "Image", name: "image", widget: "image" },
                                    { label: "Text", name: "text", widget: "text" }
                                ]
                            }
                        ]
                    }
                ]
            }
        });
    </script>
</body>
</html>
